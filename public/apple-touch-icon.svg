<svg width="180" height="180" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" fill="url(#iconGrad)" rx="20"/>

  <!-- Large "B" letter -->
  <text x="90" y="125" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="bold" text-anchor="middle" stroke="#000" stroke-width="6" fill="none">B</text>
  <text x="90" y="125" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
</svg>