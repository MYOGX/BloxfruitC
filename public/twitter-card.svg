<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Vibrant gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:1" />
    </linearGradient>

    <!-- Radial burst effect -->
    <radialGradient id="burst" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#burst)"/>

  <!-- Comic burst rays -->
  <g opacity="0.3">
    <path d="M 600,315 L 100,50" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 300,50" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 500,50" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 700,50" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 900,50" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 1100,50" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 1100,250" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 1100,380" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 1100,580" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 900,580" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 700,580" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 500,580" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 300,580" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 100,580" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 100,380" stroke="#ffaa00" stroke-width="3"/>
    <path d="M 600,315 L 100,250" stroke="#ffaa00" stroke-width="3"/>
  </g>

  <!-- Top emoji decorations -->
  <text x="80" y="80" font-size="50" fill="#fff">🎮</text>
  <text x="1070" y="80" font-size="50" fill="#fff">⚔️</text>

  <!-- Main Title "BLOX FRUITS" with outline -->
  <text x="600" y="200" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" stroke="#000" stroke-width="10" fill="none">BLOX</text>
  <text x="600" y="200" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#fff">BLOX</text>

  <text x="600" y="330" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" stroke="#000" stroke-width="10" fill="none">FRUITS</text>
  <text x="600" y="330" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#fff">FRUITS</text>

  <!-- Subtitle -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" stroke="#000" stroke-width="5" fill="none">42 FRUITS | PVP COMBO GUIDE</text>
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#00d9ff">42 FRUITS | PVP COMBO GUIDE</text>

  <!-- Bottom text -->
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" stroke="#000" stroke-width="4" fill="none">⚡ DEADLY COMBOS ⚡</text>
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#ffd700">⚡ DEADLY COMBOS ⚡</text>

  <!-- Bottom emoji decorations -->
  <text x="80" y="590" font-size="50" fill="#fff">👊</text>
  <text x="1070" y="590" font-size="50" fill="#fff">🌀</text>
</svg>